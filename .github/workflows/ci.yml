name: CI

on:
  push:
    branches: ["main", "develop", "feature/*", "fix/*", "hotfix/*", "release/*"]
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zces_user
          POSTGRES_PASSWORD: zces_dev_pw
          POSTGRES_DB: zces_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zces_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://zces_user:zces_dev_pw@127.0.0.1:5432/zces_dev
      JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdef
      INITIAL_ADMIN_EMAIL: admin@zarandsteel.ir
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: ci-admin-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type-check (mypy)
        run: mypy app
      - name: Apply migrations
        run: python -m alembic upgrade head
      - name: Test (pytest)
        run: pytest

  frontend:
    name: Frontend (eslint, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type-check (tsc)
        run: npx tsc --noEmit
      - name: Build (next build)
        run: npm run build
